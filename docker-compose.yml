services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: northwind
      POSTGRES_USER: northwind
      POSTGRES_PASSWORD: northwind
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U northwind"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://northwind:northwind@db:5432/northwind
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      POLICIES_DIR: /app/policies
      SUBMISSIONS_DIR: /app/submissions
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./policies:/app/policies:ro
      - ./submissions:/app/submissions:ro
      - ./eval_results:/app/eval_results

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  pgdata:
